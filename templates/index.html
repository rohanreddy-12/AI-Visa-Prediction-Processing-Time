<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Visa Estimator</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
}

/* Layout */
.container {
    max-width: 800px;
    margin: 60px auto;
    padding: 30px;
}

/* Glass Card */
.card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

/* Headings */
h1 {
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #cbd5e1;
    margin-bottom: 30px;
}

/* Form grid */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.full {
    grid-column: span 2;
}

label {
    font-size: 14px;
    color: #cbd5e1;
}

/* Inputs */
select, input {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    margin-top: 5px;
    background: rgba(255,255,255,0.1);
    color: white;
    outline: none;
}

/* 🔥 FIX FOR DROPDOWN VISIBILITY */
select option {
    color: black;
    background: white;
}

select:focus, input:focus {
    box-shadow: 0 0 0 2px #38bdf8;
}

/* Button */
button {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    margin-top: 20px;
    background: linear-gradient(90deg, #38bdf8, #6366f1);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.02);
}

/* Result Card */
.result {
    margin-top: 25px;
    padding: 20px;
    border-radius: 15px;
    background: rgba(56,189,248,0.15);
    display: none;
}

.big {
    font-size: 28px;
    font-weight: bold;
}

/* Loader */
.loader {
    display: none;
    text-align: center;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>AI Visa Estimator</h1>
<p class="subtitle">Predict H-1B processing time with AI</p>

<form id="predictionForm">

<div class="grid">

<!-- Employer -->
<div>
<label>Employer State</label>
<select id="emp_state"></select>
</div>

<div>
<label>Work State</label>
<select id="work_state"></select>
</div>

<!-- Job -->
<div>
<label>Job Title</label>
<select id="job_title">
<option>SOFTWARE ENGINEER</option>
<option>DATA SCIENTIST</option>
<option>SYSTEM ANALYST</option>
</select>
</div>

<div>
<label>SOC Category</label>
<select id="soc_name">
<option>Software Developers, Applications</option>
<option>Computer Systems Analysts</option>
</select>
</div>

<!-- Salary -->
<div>
<label>Prevailing Wage ($)</label>
<input type="number" id="prevailing_wage" value="100000">
</div>

<div>
<label>Wage Level</label>
<select id="pw_level">
<option>Level I</option>
<option>Level II</option>
<option>Level III</option>
<option>Level IV</option>
</select>
</div>

<!-- Employment -->
<div>
<label>Full Time</label>
<select id="full_time_position">
<option value="Y">Yes</option>
<option value="N">No</option>
</select>
</div>

<div>
<label>H1B Dependent</label>
<select id="emp_h1b_dependent">
<option value="Y">Yes</option>
<option value="N">No</option>
</select>
</div>

<!-- Year -->
<div class="full">
<label>Case Year</label>
<select id="case_year">
<option>2022</option>
<option>2023</option>
<option selected>2024</option>
</select>
</div>

</div>

<button type="submit">✨ Predict Processing Time</button>

<div class="loader" id="loader">⏳ Predicting...</div>

</form>

<div class="result" id="resultBox">
<p class="big" id="exactDays"></p>
<p id="rangeDays"></p>
<p id="confidence"></p>
</div>

</div>
</div>

<script>

// ✅ FULL US STATES (Premium)
const states = {
"Alabama":"AL","Alaska":"AK","Arizona":"AZ","Arkansas":"AR",
"California":"CA","Colorado":"CO","Connecticut":"CT","Delaware":"DE",
"Florida":"FL","Georgia":"GA","Hawaii":"HI","Idaho":"ID",
"Illinois":"IL","Indiana":"IN","Iowa":"IA","Kansas":"KS",
"Kentucky":"KY","Louisiana":"LA","Maine":"ME","Maryland":"MD",
"Massachusetts":"MA","Michigan":"MI","Minnesota":"MN","Mississippi":"MS",
"Missouri":"MO","Montana":"MT","Nebraska":"NE","Nevada":"NV",
"New Hampshire":"NH","New Jersey":"NJ","New Mexico":"NM","New York":"NY",
"North Carolina":"NC","North Dakota":"ND","Ohio":"OH","Oklahoma":"OK",
"Oregon":"OR","Pennsylvania":"PA","Rhode Island":"RI","South Carolina":"SC",
"South Dakota":"SD","Tennessee":"TN","Texas":"TX","Utah":"UT",
"Vermont":"VT","Virginia":"VA","Washington":"WA","West Virginia":"WV",
"Wisconsin":"WI","Wyoming":"WY"
};

function populateStates(id){
    let el = document.getElementById(id);
    for(let s in states){
        let opt = document.createElement("option");
        opt.value = states[s];   // send short code
        opt.text = s;            // show full name
        el.appendChild(opt);
    }
}

populateStates("emp_state");
populateStates("work_state");

document.getElementById("predictionForm").addEventListener("submit", async function(e){
    e.preventDefault();

    loader.style.display = "block";
    resultBox.style.display = "none";

    const data = {
        emp_state: emp_state.value,
        work_state: work_state.value,
        job_title: job_title.value,
        soc_name: soc_name.value,
        full_time_position: full_time_position.value,
        prevailing_wage: prevailing_wage.value,
        pw_level: pw_level.value,
        emp_h1b_dependent: emp_h1b_dependent.value,
        case_year: case_year.value
    };

    const res = await fetch("/api/predict",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(data)
    });

    const result = await res.json();

    loader.style.display = "none";

    if(result.status==="success"){
        resultBox.style.display="block";
        exactDays.innerText = result.predicted_days + " Days";
        rangeDays.innerText = "Range: " + result.range;
        confidence.innerText = "Confidence: " + result.confidence_interval;
    }
});
</script>

</body>
</html>
